<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)" />

  <g stroke="#1E293B" stroke-opacity="0.2" stroke-width="1">
    <path d="M0,68 H1200 M0,136 H1200 M0,204 H1200 M0,272 H1200 M0,340 H1200 M0,408 H1200 M0,476 H1200 M0,544 H1200 M0,612 H1200" />
    <path d="M68,0 V680 M136,0 V680 M204,0 V680 M272,0 V680 M340,0 V680 M408,0 V680 M476,0 V680 M544,0 V680 M612,0 V680 M680,0 V680 M748,0 V680 M816,0 V680 M884,0 V680 M952,0 V680 M1020,0 V680 M1088,0 V680 M1156,0 V680" />
  </g>

  <circle cx="240" cy="220" r="220" fill="#1E40AF" opacity="0.08" />
  <circle cx="950" cy="420" r="240" fill="#10B981" opacity="0.05" />

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect width="44" height="44" rx="10" fill="#1E40AF" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1.5" />
    <path d="M14 30 L28 14 L32 18 L18 34 L12 36 Z" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linejoin="round" />

    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#F8FAFC">
      smooth_signature_pad
    </text>
    <text x="60" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">
      Fountain Pen Velocity Pressure • Legal E-Signature Capture Card • Cryptographic Audit Trail
    </text>

    <g transform="translate(940, 6)">
      <rect width="130" height="30" rx="15" fill="#064E3B" fill-opacity="0.5" stroke="#10B981" stroke-width="1.2" />
      <text x="65" y="19" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#34D399">v1.3.0 READY</text>
    </g>
  </g>

  <!-- LEFT HERO CARD: SignatureCaptureCard -->
  <g transform="translate(60, 115)" filter="url(#shadow)">
    <rect width="660" height="520" rx="20" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />

    <!-- Card Header -->
    <g transform="translate(24, 24)">
      <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Authorized Signatory</text>
      <text x="0" y="34" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">Draw your legal signature inside the frame above the baseline</text>

      <!-- Ink Color Selector Chips -->
      <g transform="translate(430, 0)">
        <rect width="84" height="26" rx="6" fill="#1E40AF" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1.5" />
        <circle cx="12" cy="13" r="4" fill="#3B82F6" />
        <text x="48" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#93C5FD">Legal Blue</text>

        <rect x="92" width="86" height="26" rx="6" fill="#1E293B" stroke="#374151" />
        <circle cx="104" cy="13" r="4" fill="#64748B" />
        <text x="142" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8">Black</text>
      </g>
    </g>

    <!-- Signature Pad Canvas -->
    <g transform="translate(24, 75)">
      <rect width="612" height="250" rx="14" fill="#030712" stroke="#1F2937" stroke-width="1.5" />

      <!-- Baseline Guide with X Sign Here -->
      <line x1="20" y1="200" x2="592" y2="200" stroke="#334155" stroke-dasharray="6,4" stroke-width="1.2" />
      <text x="30" y="192" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748B">✕ Sign Here</text>

      <!-- Fluid Signature Bézier Splines in Legal Blue -->
      <path d="M 60 170 Q 90 90 120 160 T 160 190 Q 200 80 230 180 T 270 190 Q 330 220 370 120 T 420 180 Q 470 210 520 130 T 560 170"
            fill="none" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 60 170 Q 90 90 120 160 T 160 190 Q 200 80 230 180 T 270 190 Q 330 220 370 120 T 420 180 Q 470 210 520 130 T 560 170"
            fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Cursor Touch Indicator -->
      <circle cx="560" cy="170" r="10" fill="#3B82F6" fill-opacity="0.3" />
      <circle cx="560" cy="170" r="4" fill="#60A5FA" />
    </g>

    <!-- Toolbar: Undo, Redo, Clear, Count, Accept -->
    <g transform="translate(24, 340)">
      <rect width="32" height="32" rx="6" fill="#1E293B" stroke="#374151" />
      <text x="16" y="21" text-anchor="middle" font-size="14" fill="#CBD5E1">↶</text>

      <rect x="40" width="32" height="32" rx="6" fill="#1E293B" stroke="#374151" />
      <text x="56" y="21" text-anchor="middle" font-size="14" fill="#CBD5E1">↷</text>

      <rect x="80" width="32" height="32" rx="6" fill="#1E293B" stroke="#374151" />
      <text x="96" y="20" text-anchor="middle" font-size="13" fill="#F87171">🗑</text>

      <text x="125" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">3 strokes • 120Hz velocity</text>

      <!-- Accept & Sign Button -->
      <g transform="translate(482, 0)">
        <rect width="130" height="34" rx="8" fill="#10B981" />
        <text x="65" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#000000">✓ Accept &amp; Sign</text>
      </g>
    </g>

    <!-- Legal Consent Disclaimer Checkbox -->
    <g transform="translate(24, 395)">
      <rect width="18" height="18" rx="4" fill="#10B981" />
      <path d="M4 9 L7 12 L14 5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="28" y="14" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">
        I acknowledge this digital signature is legally binding under applicable electronic signature laws (IT Act / ESIGN).
      </text>
    </g>

    <!-- Cryptographic Audit Trail Strip -->
    <g transform="translate(24, 435)">
      <rect width="612" height="60" rx="10" fill="#030712" stroke="#1F2937" />
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#10B981">
        CRYPTOGRAPHIC AUDIT TRAIL METADATA
      </text>
      <text x="16" y="44" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8">
        Signer: Govind Tank • Time: 2026-11-17T14:32:00Z • Hash: <tspan fill="#67E8F9">cbf29ce484222325</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: MULTI-PEN STYLES & EXPORT CARDS -->
  <g transform="translate(750, 115)">
    <!-- Pen Style 1: Fountain Pen -->
    <g filter="url(#shadow)">
      <rect width="390" height="110" rx="16" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />
      <text x="18" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">FOUNTAIN PEN VELOCITY PRESSURE</text>
      <text x="18" y="40" font-family="-apple-system, sans-serif" font-size="10.5" fill="#64748B">Dynamic thick-thin strokes calibrated to drawing speed</text>
      <path d="M 20 80 Q 70 50 120 75 T 220 80 T 320 60" fill="none" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 20 80 Q 70 50 120 75 T 220 80 T 320 60" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Pen Style 2: Ballpoint Uniform Monoline -->
    <g transform="translate(0, 130)" filter="url(#shadow)">
      <rect width="390" height="110" rx="16" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />
      <text x="18" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34D399">BALLPOINT MONOLINE</text>
      <text x="18" y="40" font-family="-apple-system, sans-serif" font-size="10.5" fill="#64748B">Strict, uniform line width ideal for legal documents</text>
      <path d="M 20 80 Q 80 55 140 75 T 240 80 T 340 65" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Pen Style 3: Auto-Trim Vector SVG Export -->
    <g transform="translate(0, 260)" filter="url(#shadow)">
      <rect width="390" height="115" rx="16" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />
      <text x="18" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FBBF24">AUTO-TRIM SVG &amp; PNG EXPORT</text>
      <text x="18" y="40" font-family="-apple-system, sans-serif" font-size="10.5" fill="#64748B">Tightly crops whitespace around strokes with zero margin waste</text>
      <rect x="18" y="52" width="165" height="46" rx="8" fill="#030712" stroke="#1F2937" />
      <text x="100" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FBBF24">toSvg(trim: true)</text>
      <rect x="195" y="52" width="175" height="46" rx="8" fill="#030712" stroke="#1F2937" />
      <text x="282" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">toPng(trim: true)</text>
    </g>

    <!-- Pub Command Box -->
    <g transform="translate(0, 395)" filter="url(#shadow)">
      <rect width="390" height="125" rx="16" fill="#030712" stroke="#1E40AF" stroke-width="1.2" />
      <text x="18" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#60A5FA">INSTALL IN 1 COMMAND</text>
      <rect x="18" y="48" width="354" height="44" rx="8" fill="#0B132B" stroke="#1E293B" />
      <text x="28" y="75" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34D399">$ flutter pub add smooth_signature_pad</text>
    </g>
  </g>
</svg>
