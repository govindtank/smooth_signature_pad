<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid pattern -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200" />
    <path d="M70,0 V630 M140,0 V630 M210,0 V630 M280,0 V630 M350,0 V630 M420,0 V630 M490,0 V630 M560,0 V630 M630,0 V630 M700,0 V630 M770,0 V630 M840,0 V630 M910,0 V630 M980,0 V630 M1050,0 V630 M1120,0 V630" />
  </g>

  <!-- Radial Glow Behind Card -->
  <circle cx="600" cy="315" r="280" fill="#38BDF8" opacity="0.08" filter="blur(60px)" />

  <!-- Main Showcase Container -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="75" width="920" height="480" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    <rect x="140" y="75" width="920" height="480" rx="24" fill="none" stroke="url(#primary)" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Header Section -->
  <text x="180" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" letter-spacing="-0.5">
    smooth_signature_pad
  </text>
  <text x="180" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94A3B8">
    Zero-Latency Natural Ink • Real-Time Velocity Curves • Vector SVG &amp; PNG Export
  </text>

  <!-- Status Badges -->
  <g transform="translate(740, 108)">
    <rect width="130" height="28" rx="14" fill="#0369A1" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1" />
    <text x="65" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#38BDF8">REAL-TIME INK</text>
  </g>
  <g transform="translate(885, 108)">
    <rect width="135" height="28" rx="14" fill="#15803D" fill-opacity="0.2" stroke="#4ADE80" stroke-width="1" />
    <text x="67" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#4ADE80">120 FPS FLUID</text>
  </g>

  <!-- Inner Signature Pad Canvas Simulation -->
  <g transform="translate(180, 190)">
    <rect width="840" height="310" rx="16" fill="#020617" stroke="#1E293B" stroke-width="1.5" />

    <!-- Guideline Baseline -->
    <line x1="40" y1="240" x2="800" y2="240" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6" />
    <text x="45" y="230" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#475569">✕</text>
    <text x="75" y="230" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#475569" letter-spacing="1">SIGN HERE</text>

    <!-- Drawn Dynamic Signature Path (Catmull-Rom Cubic Bézier simulation) -->
    <path d="M 140 210 Q 180 120 220 180 T 260 220 Q 300 240 330 160 T 360 210 Q 420 270 470 140 T 520 230 Q 560 260 620 170 T 670 210 Q 720 180 750 200"
          fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M 140 210 Q 180 120 220 180 T 260 220 Q 300 240 330 160 T 360 210 Q 420 270 470 140 T 520 230 Q 560 260 620 170 T 670 210 Q 720 180 750 200"
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Active Touch Cursor Indicator (0ms Touch Point) -->
    <circle cx="750" cy="200" r="14" fill="#38BDF8" fill-opacity="0.25" />
    <circle cx="750" cy="200" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="750" cy="200" r="22" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3,3" />

    <!-- Live HUD Tooltip -->
    <g transform="translate(680, 130)">
      <rect width="140" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="70" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#F8FAFC" font-weight="bold">Live Stroke: 120Hz</text>
    </g>

    <!-- Pen Style Pills inside pad bottom -->
    <g transform="translate(40, 265)">
      <rect width="95" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="47" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">Fountain</text>

      <rect x="105" width="95" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="152" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Ballpoint</text>

      <rect x="210" width="105" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="262" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Calligraphy</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(640, 265)">
      <rect width="75" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="37" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Undo</text>

      <rect x="85" width="75" height="26" rx="6" fill="#0284C7" />
      <text x="122" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Export</text>
    </g>
  </g>
</svg>